---
deployment:
  tasks:
    - export DEPLOYPATH=/home/drarmank/public_html

    # Install dependencies and build frontend
    - cd src/frontend
    - npm install
    - npm run build

    # Create deployment directory
    - /bin/mkdir -p $DEPLOYPATH

    # Remove old files
    - /bin/find $DEPLOYPATH -mindepth 1 -maxdepth 1 -exec rm -rf {} \;

    # Copy Vite build output
    - /bin/cp -R dist/* $DEPLOYPATH/

    # React Router SPA fallback
    - /bin/cp $DEPLOYPATH/index.html $DEPLOYPATH/404.html
